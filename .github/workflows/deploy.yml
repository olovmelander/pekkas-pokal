name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# contents: push the gh-pages branch; pages + id-token: the artifact
# deployment path via the vendored patient action.
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production

      - name: Copy CSV file to dist
        run: |
          cp competition-data.csv dist/competition-data.csv
          if [ -f public/competition-data.csv ]; then
            cp public/competition-data.csv dist/competition-data.csv
          fi

      - name: Copy static assets
        run: |
          mkdir -p dist/src
          cp -r src/styles dist/src/
          cp -r src/scripts dist/src/
          cp -r src/data dist/src/
          cp -r src/games dist/src/

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/competition-data.csv
          test -f dist/src/games/pinball/index.js
          test -f dist/logo-pekkas-pokal.png
          echo "dist: $(find dist -type f | wc -l) files, $(du -sh dist | cut -f1)"

      # Publish by pushing the gh-pages branch rather than using
      # actions/deploy-pages. That action waits for the Pages queue to pick the
      # deployment up and hard-caps its wait at 10 minutes (MAX_TIMEOUT =
      # 600000 in its source, and the input is clamped to it). When the queue is
      # slower than that — which it has been — the action cancels a deployment
      # that had not actually failed. Pushing a branch hands off to Pages
      # asynchronously, so a slow queue delays the site instead of failing here.
      - name: Publish to gh-pages branch
        run: |
          cd dist
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA} from ${GITHUB_REF_NAME}"
          git push -f \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Second delivery path: artifact deployment with a patient timeout.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy-patient:
    # Artifact deployment through the vendored deploy-pages with the 10-minute
    # ceiling raised (see .github/actions/deploy-pages-patient). On days when
    # the Pages queue takes 10-25 minutes to process a deployment, the stock
    # action cancels deployments that would have succeeded. This job may fail
    # quickly if the Pages source is set to branch mode — the branch publish
    # above covers that case; the two paths are independent and whichever
    # lands first wins.
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout (for the vendored action)
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages (patient)
        id: deployment
        uses: ./.github/actions/deploy-pages-patient
        with:
          timeout: 2700000
          error_count: 60
